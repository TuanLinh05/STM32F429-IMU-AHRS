<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">STM32F429 sensor acquisition + AHRS</title><desc id="desc">Active path: main.c calls IMU_System.c; observations are available through the debugger</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L8,5 L0,9" fill="none" stroke="#168c7a" stroke-width="1.5"/></marker></defs><rect width="1200" height="680" rx="24" fill="#f3f7fa"/><text x="42" y="58" font-family="Arial, sans-serif" font-size="32" fill="#17324d" font-weight="700">STM32F429 sensor acquisition + AHRS</text><text x="42" y="93" font-family="Arial, sans-serif" font-size="19" fill="#486277" font-weight="400">Active path: main.c calls IMU_System.c; observations are available through the debugger</text><rect x="42" y="132" width="315" height="135" rx="16" fill="#ffffff" stroke="#c7d7e2" stroke-width="2"/><text x="64" y="170" font-family="Arial, sans-serif" font-size="24" fill="#17324d" font-weight="700">ICM-20602 / SPI1</text><text x="64" y="206" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">PA5 / PA6 / PA7, CS PA4</text><text x="64" y="236" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Acceleration + angular rate</text><rect x="42" y="299" width="315" height="135" rx="16" fill="#ffffff" stroke="#c7d7e2" stroke-width="2"/><text x="64" y="337" font-family="Arial, sans-serif" font-size="24" fill="#17324d" font-weight="700">Compass / I2C1</text><text x="64" y="373" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">PB6 SCL + PB7 SDA</text><text x="64" y="403" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">QMC 0x0D or HMC 0x1E</text><rect x="42" y="466" width="315" height="135" rx="16" fill="#ffffff" stroke="#c7d7e2" stroke-width="2"/><text x="64" y="504" font-family="Arial, sans-serif" font-size="24" fill="#17324d" font-weight="700">BMP280 / I2C1</text><text x="64" y="540" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Address 0x76 or 0x77</text><text x="64" y="570" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Pressure + temperature</text><rect x="442" y="132" width="315" height="135" rx="16" fill="#e3f5f0" stroke="#168c7a" stroke-width="2"/><text x="464" y="170" font-family="Arial, sans-serif" font-size="24" fill="#17324d" font-weight="700">Roll + pitch Kalman</text><text x="464" y="206" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Two states: angle + bias</text><text x="464" y="236" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Gyro bias applied at update</text><rect x="442" y="299" width="315" height="135" rx="16" fill="#e3f5f0" stroke="#168c7a" stroke-width="2"/><text x="464" y="337" font-family="Arial, sans-serif" font-size="24" fill="#17324d" font-weight="700">Tilt-compensated yaw</text><text x="464" y="373" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Axis remap + declination</text><text x="464" y="403" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Mag calibration not applied</text><rect x="442" y="466" width="315" height="135" rx="16" fill="#e3f5f0" stroke="#168c7a" stroke-width="2"/><text x="464" y="504" font-family="Arial, sans-serif" font-size="24" fill="#17324d" font-weight="700">Barometric altitude</text><text x="464" y="540" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Pressure reference: 101325 Pa</text><text x="464" y="570" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">No captured startup baseline</text><rect x="842" y="132" width="315" height="280" rx="16" fill="#ffffff" stroke="#c7d7e2" stroke-width="2"/><text x="864" y="170" font-family="Arial, sans-serif" font-size="24" fill="#17324d" font-weight="700">Debugger outputs</text><text x="864" y="206" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">droneData + pitch / roll</text><text x="864" y="236" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">yaw + alt_rel</text><text x="864" y="266" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Status flags from startup</text><text x="864" y="296" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">No motor / flight control</text><rect x="842" y="466" width="315" height="135" rx="16" fill="#ffffff" stroke="#c7d7e2" stroke-width="2"/><text x="864" y="504" font-family="Arial, sans-serif" font-size="24" fill="#17324d" font-weight="700">Timing + heartbeat</text><text x="864" y="540" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">Blocking HAL reads</text><text x="864" y="570" font-family="Arial, sans-serif" font-size="20" fill="#486277" font-weight="400">4 ms delay + GPIO PG13</text><path d="M357 196 H430" fill="none" stroke="#168c7a" stroke-width="3" marker-end="url(#arrow)"/><path d="M357 363 H430" fill="none" stroke="#168c7a" stroke-width="3" marker-end="url(#arrow)"/><path d="M357 530 H430" fill="none" stroke="#168c7a" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 267 V287" fill="none" stroke="#168c7a" stroke-width="3" marker-end="url(#arrow)"/><text x="615" y="287" font-family="Arial, sans-serif" font-size="18" fill="#168c7a" font-weight="700">roll / pitch</text><path d="M757 196 H830" fill="none" stroke="#168c7a" stroke-width="3" marker-end="url(#arrow)"/><path d="M757 363 H830" fill="none" stroke="#168c7a" stroke-width="3" marker-end="url(#arrow)"/><path d="M757 530 H794 V430 H1000 V412" fill="none" stroke="#168c7a" stroke-width="3" marker-end="url(#arrow)"/><text x="42" y="648" font-family="Arial, sans-serif" font-size="21" fill="#17324d" font-weight="700">Sensor detection does not establish continuous health or validated attitude accuracy.</text></svg>
